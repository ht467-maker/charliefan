                                                        <th className="px-4 py-4 w-16 sticky left-28 bg-slate-50 z-10 border-r border-slate-100">座號</th>
                                                        <th className="px-4 py-4 w-28 sticky left-44 bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">姓名</th>
                                                        
                                                        {/* 動態渲染費用名目欄位 */}
                                                        {fees.map(f => (
                                                            <th key={f.id} className="px-4 py-4 min-w-[150px] border-r border-slate-100 text-center">
                                                                <p className="font-semibold text-slate-800 text-sm truncate">{f.name}</p>
                                                                <p className="text-[11px] font-normal text-slate-400">單價: ${f.amount}</p>
                                                            </th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-sm">
                                                    {filteredStudents.map(student => (
                                                        <tr key={student.id} className="hover:bg-slate-50/30">
                                                            <td className="px-4 py-3 sticky left-0 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-100 text-slate-500 text-xs font-medium">
                                                                {student.class}
                                                            </td>
                                                            <td className="px-4 py-3 sticky left-28 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-100 font-mono text-slate-600">
                                                                {student.seatNo}
                                                            </td>
                                                            <td className="px-4 py-3 sticky left-44 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] font-semibold text-slate-800">
                                                                {student.name}
                                                            </td>

                                                            {/* 動態渲染各費用繳納格子 */}
                                                            {fees.map(fee => {
                                                                const p = getStudentPayment(student.id, fee.id);
                                                                let statusColor = "bg-rose-50 text-rose-600 border-rose-100";
                                                                if (p.status === "已繳清") statusColor = "bg-emerald-50 text-emerald-600 border-emerald-100";
                                                                if (p.status === "部分繳納") statusColor = "bg-amber-50 text-amber-600 border-amber-100";

                                                                return (
                                                                    <td 
                                                                        key={fee.id} 
                                                                        className="p-2 border-r border-slate-100 text-center transition-colors cursor-pointer group/cell hover:bg-slate-50"
                                                                        onClick={() => setPaymentModal({ student, fee })}
                                                                    >
                                                                        <div className={`mx-auto rounded-lg px-2.5 py-1.5 border text-xs font-semibold ${statusColor} transition-all transform group-hover/cell:scale-[1.02] flex flex-col items-center justify-center min-h-[48px]`}>
                                                                            <span>{p.status}</span>
                                                                            <span className="text-[10px] opacity-80 mt-0.5">
                                                                                {p.status === "部分繳納" ? `$${p.paidAmount}/$${p.customAmount}` : `$${p.customAmount}`}
                                                                            </span>
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    ))}

                                                    {/* 收費統計橫列 */}
                                                    <tr className="bg-slate-50 font-bold border-t-2 border-slate-200">
                                                        <td colSpan="3" className="px-4 py-4 text-right sticky left-0 bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] text-slate-700">
                                                            目前已收/應收 統計
                                                        </td>
                                                        {fees.map(f => {
                                                            const fStat = getFeeStats(f.id);
                                                            return (
                                                                <td key={f.id} className="p-4 text-center border-r border-slate-200">
                                                                    <p className="text-emerald-600 text-sm">${fStat.received.toLocaleString()}</p>
                                                                    <p className="text-slate-400 text-[10px] font-normal mt-0.5">應收: ${fStat.expected.toLocaleString()}</p>
                                                                    <div className="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                                                                        <div 
                                                                            className="bg-brand-500 h-full" 
                                                                            style={{ width: `${fStat.expected > 0 ? (fStat.received / fStat.expected) * 100 : 0}%` }}
                                                                        ></div>
                                                                    </div>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 5. Excel 備份與匯入 */}
                            {activeTab === 'backup' && (
                                <div className="space-y-6 max-w-2xl">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-emerald-50 p-2 text-emerald-600 rounded-lg">
                                                <i data-lucide="file-spreadsheet" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-lg text-slate-800">試算表備份中心</h3>
                                                <p className="text-xs text-slate-500">此功能可匯出或匯入整個系統的資料。包含班級、學生與所有繳費歷史紀錄。</p>
                                            </div>
                                        </div>

                                        <hr className="border-slate-100" />

                                        {/* 匯出備份區 */}
                                        <div className="space-y-3">
                                            <h4 className="font-semibold text-slate-700">資料安全備份 (匯出 Excel)</h4>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                點選下方按鈕，系統會將名單大表包裝，產出含有多張工作表 (學生名冊、收費項目、繳費矩陣) 的 Excel 試算表，供您留底及離線編輯。
                                            </p>
                                            <button 
                                                onClick={exportToExcel}
                                                className="w-full md:w-auto px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-md"
                                            >
                                                <i data-lucide="download" className="w-4 h-4"></i>
                                                下載 Excel 備份大表 (.xlsx)
                                            </button>
                                        </div>

                                        <hr className="border-slate-100" />

                                        {/* 匯入備份區 */}
                                        <div className="space-y-3">
                                            <h4 className="font-semibold text-slate-700">復原或讀取備份資料 (匯入 Excel)</h4>
                                            <p className="text-xs text-rose-500 leading-relaxed">
                                                ⚠️ 警告：匯入檔案將會完全覆蓋此瀏覽器當前儲存的學生、費用及所有繳費資料。請先下載備份以防萬一。
                                            </p>
                                            <div className="flex items-center justify-center w-full">
                                                <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-200 border-dashed rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100/50 transition-colors">
                                                    <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                                        <i data-lucide="upload-cloud" className="w-8 h-8 text-slate-400 mb-2"></i>
                                                        <p className="mb-1 text-sm text-slate-500 font-semibold">點此處選擇並上傳備份 Excel 檔案</p>
                                                        <p className="text-xs text-slate-400">僅支援由本系統所匯出的 .xlsx 試算表格式</p>
                                                    </div>
                                                    <input 
                                                        type="file" 
                                                        accept=".xlsx" 
                                                        className="hidden" 
                                                        onChange={importFromExcel}
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* --- 全域互動彈出 Modal 區 --- */}

                    {/* Modal 1: 學生快速批量匯入面板 */}
                    {showImportModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-slate-800">快速批量匯入學生</h3>
                                    <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">匯入至特定班級</label>
                                    <select 
                                        value={importClass} 
                                        onChange={(e) => setImportClass(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                    >
                                        {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">請在下方貼上名冊文字</label>
                                    <textarea 
                                        rows="8" 
                                        placeholder={"請使用「座號+空白+姓名」格式，每行一位學生，例如：\n01 王小明\n02 陳大華\n03 林阿美"}
                                        value={importRawText}
                                        onChange={(e) => setImportRawText(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-brand-500 font-mono text-slate-700"
                                    ></textarea>
                                </div>

                                <div className="flex justify-end gap-2 mt-2">
                                    <button 
                                        onClick={() => setShowImportModal(false)} 
                                        className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={handleBatchImport} 
                                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold"
                                    >
                                        確認解析並匯入
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 2: 學生大量批次編輯面板 */}
                    {showBatchEditModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-slate-800">批次修改「{batchClassFilter}」全班名單</h3>
                                    <button onClick={() => setShowBatchEditModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="bg-amber-50 text-amber-800 border border-amber-100 p-3 rounded-xl text-xs flex gap-2">
                                    <i data-lucide="alert-triangle" className="w-4 h-4 shrink-0 mt-0.5"></i>
                                    <span>
                                        這將<b>完全覆蓋並取代</b>當前該班級的所有學生。您可以直接在下方框內編輯，修改座號或姓名，或將別處的清單貼上於此。
                                    </span>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">框內名單內容 (每行一位，格式：座號  姓名)</label>
                                    <textarea 
                                        rows="10" 
                                        value={batchStudentsText}
                                        onChange={(e) => setBatchStudentsText(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-brand-500 font-mono text-slate-700"
                                    ></textarea>
                                </div>

                                <div className="flex justify-end gap-2 mt-2">
                                    <button 
                                        onClick={() => setShowBatchEditModal(false)} 
                                        className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold"
                                    >
                                        放棄變更
                                    </button>
                                    <button 
                                        onClick={handleSaveBatchEdit} 
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold"
                                    >
                                        儲存並更新名冊
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 3: 修改繳費面板 */}
                    {paymentModal && (() => {
                        const { student, fee } = paymentModal;
                        const record = getStudentPayment(student.id, fee.id);
                        return (
                            <PaymentModal 
                                student={student}
                                fee={fee}
                                record={record}
                                onCancel={() => setPaymentModal(null)}
                                onSave={handleSavePaymentModal}
                                showToast={showToast}
                            />
                        );
                    })()}

                    {/* Toast 訊息提醒 */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-slate-900 text-white py-3 px-5 rounded-2xl shadow-2xl border border-slate-800 animate-slide-in">
                            <div className={`w-2 h-2 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'}`}></div>
                            <span className="text-sm font-semibold">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        // 啟動 React
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

        // 動態初始化 Lucide Icons
        setInterval(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
