                                                                            className="w-32 bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5 animate-pulse"
                                                                            autoFocus
                                                                        />
                                                                    ) : student.name}
                                                                </td>
                                                                <td className="px-6 py-3.5 text-right">
                                                                    <div className="flex items-center justify-end gap-1.5">
                                                                        <button 
                                                                            type="button"
                                                                            onClick={() => setEditingStudent(editingStudent === student.id ? null : student.id)}
                                                                            className="p-1 rounded text-slate-400 hover:text-brand-600 hover:bg-brand-50"
                                                                        >
                                                                            <SvgIcon name="edit" />
                                                                        </button>
                                                                        <button 
                                                                            type="button"
                                                                            onClick={() => handleDeleteStudent(student.id, student.name)}
                                                                            className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50"
                                                                        >
                                                                            <SvgIcon name="trash-2" />
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {filteredStudents.length === 0 && (
                                                            <tr>
                                                                <td colSpan="3" className="px-6 py-12 text-center text-slate-400">
                                                                    此班級目前沒有任何學生，可點選上方「快速批量匯入」快速貼上名單。
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 3. 費用名目設定 */}
                            {activeTab === 'fees' && (
                                <div className="space-y-6 max-w-5xl">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm h-fit">
                                            <h3 className="font-bold text-lg text-slate-800 mb-4">新增收費名目</h3>
                                            <form onSubmit={handleAddFee} className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">收費項目名稱</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="例：班費、講義費" 
                                                        value={newFee.name} 
                                                        onChange={(e) => setNewFee({...newFee, name: e.target.value})}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">預設應繳金額</label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="500" 
                                                        value={newFee.amount} 
                                                        onChange={(e) => setNewFee({...newFee, amount: e.target.value})}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                    />
                                                </div>
                                                <button type="submit" className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-md transition-colors">
                                                    建立費用項目
                                                </button>
                                            </form>
                                        </div>

                                        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                                <span className="font-bold text-slate-800">所有費用名目</span>
                                                <span className="text-xs text-slate-500">共 {fees.length} 個名目</span>
                                            </div>
                                            
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-slate-100 text-slate-400 text-xs font-semibold uppercase bg-slate-50/30">
                                                            <th className="px-6 py-3.5">費用名稱</th>
                                                            <th className="px-6 py-3.5 w-40">預設單價</th>
                                                            <th className="px-6 py-3.5 text-right w-28">操作</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 text-sm">
                                                        {fees.map(fee => (
                                                            <tr key={fee.id} className="hover:bg-slate-50/50 group">
                                                                <td className="px-6 py-3.5 font-medium text-slate-800">
                                                                    {editingFeeId === fee.id ? (
                                                                        <input 
                                                                            type="text" 
                                                                            value={editFeeName}
                                                                            onChange={(e) => setEditFeeName(e.target.value)}
                                                                            className="w-full bg-slate-50 border border-brand-300 rounded-xl px-2.5 py-1.5 text-sm font-semibold focus:outline-none focus:border-brand-500"
                                                                            autoFocus
                                                                        />
                                                                    ) : fee.name}
                                                                </td>
                                                                <td className="px-6 py-3.5 font-semibold text-slate-700">
                                                                    {editingFeeId === fee.id ? (
                                                                        <input 
                                                                            type="number" 
                                                                            value={editFeeAmount}
                                                                            onChange={(e) => setEditFeeAmount(e.target.value)}
                                                                            className="w-28 bg-slate-50 border border-brand-300 rounded-xl px-2.5 py-1.5 text-sm font-semibold focus:outline-none focus:border-brand-500"
                                                                        />
                                                                    ) : `$${fee.amount.toLocaleString()}`}
                                                                </td>
                                                                <td className="px-6 py-3.5 text-right">
                                                                    {editingFeeId === fee.id ? (
                                                                        <div className="flex items-center justify-end gap-1.5">
                                                                            <button 
                                                                                type="button"
                                                                                onClick={() => handleSaveEditFee(fee.id)}
                                                                                className="p-1.5 rounded-lg text-emerald-600 hover:bg-emerald-50 bg-emerald-50/30 flex items-center justify-center"
                                                                                title="儲存變更"
                                                                            >
                                                                                <SvgIcon name="check" className="w-4 h-4" />
                                                                            </button>
                                                                            <button 
                                                                                type="button"
                                                                                onClick={() => setEditingFeeId(null)}
                                                                                className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 flex items-center justify-center"
                                                                                title="取消編輯"
                                                                            >
                                                                                <SvgIcon name="x" className="w-4 h-4" />
                                                                            </button>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="flex items-center justify-end gap-1.5">
                                                                            <button 
                                                                                type="button"
                                                                                onClick={() => handleStartEditFee(fee)}
                                                                                className="p-1 rounded text-slate-400 hover:text-brand-600 hover:bg-brand-50"
                                                                                title="編輯項目"
                                                                            >
                                                                                <SvgIcon name="edit" />
                                                                            </button>
                                                                            <button 
                                                                                type="button"
                                                                                onClick={() => handleDeleteFee(fee.id, fee.name)}
                                                                                className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50"
                                                                                title="刪除項目"
                                                                            >
                                                                                <SvgIcon name="trash-2" />
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {fees.length === 0 && (
                                                            <tr>
                                                                <td colSpan="3" className="px-6 py-12 text-center text-slate-400">
                                                                    目前沒有任何費用名目，請使用左側表單新增。
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 4. 收費登記矩陣 */}
                            {activeTab === 'matrix' && (
                                <div className="space-y-6">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <div className="flex items-center gap-3">
                                            <span className="text-sm font-semibold text-slate-500">篩選班級：</span>
                                            <select 
                                                value={matrixClassFilter} 
                                                onChange={(e) => setMatrixClassFilter(e.target.value)}
                                                className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 font-medium"
                                            >
                                                <option value="all">全部班級</option>
                                                {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="text-xs text-slate-400">
                                            💡 提示：點擊任何繳費格子，可手動修改此生個別應繳、已繳金額，或快速切換狀態。
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse table-fixed">
                                                <thead>
                                                    <tr className="border-b border-slate-200 bg-slate-50/50 text-slate-500 text-xs font-bold uppercase">
                                                        <th className="px-4 py-4 w-28 sticky left-0 bg-slate-50 z-10 border-r border-slate-100">班級</th>
                                                        <th className="px-4 py-4 w-16 sticky left-28 bg-slate-50 z-10 border-r border-slate-100">座號</th>
                                                        <th className="px-4 py-4 w-28 sticky left-44 bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">姓名</th>
                                                        
                                                        {fees.map(f => (
                                                            <th key={f.id} className="px-4 py-4 min-w-[150px] border-r border-slate-100 text-center">
                                                                <p className="font-semibold text-slate-800 text-sm truncate">{f.name}</p>
                                                                <p className="text-[11px] font-normal text-slate-400">單價: ${f.amount}</p>
                                                            </th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-sm">
                                                    {filteredStudents.map(student => (
                                                        <tr key={student.id} className="hover:bg-slate-50/30">
                                                            <td className="px-4 py-3 sticky left-0 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-100 text-slate-500 text-xs font-medium">
                                                                {student.class}
                                                            </td>
                                                            <td className="px-4 py-3 sticky left-28 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-100 font-mono text-slate-600">
                                                                {student.seatNo}
                                                            </td>
                                                            <td className="px-4 py-3 sticky left-44 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] font-semibold text-slate-800">
                                                                {student.name}
                                                            </td>

                                                            {fees.map(fee => {
                                                                const p = getStudentPayment(student.id, fee.id);
                                                                
                                                                // 🔴 顯著提升色彩對比度的更新設定
                                                                let statusColor = "bg-rose-100/95 text-rose-950 border-rose-400 shadow-[inset_0_0_0_1px_rgba(225,29,72,0.15)]";
                                                                let dotColor = "bg-rose-600";
                                                                
                                                                if (p.status === "已繳清") {
                                                                    statusColor = "bg-emerald-100/95 text-emerald-950 border-emerald-400 shadow-[inset_0_0_0_1px_rgba(5,150,105,0.15)]";
                                                                    dotColor = "bg-emerald-600";
                                                                } else if (p.status === "部分繳納") {
                                                                    statusColor = "bg-amber-100/95 text-amber-950 border-amber-400 shadow-[inset_0_0_0_1px_rgba(217,119,6,0.15)]";
                                                                    dotColor = "bg-amber-600";
                                                                }

                                                                return (
                                                                    <td 
                                                                        key={fee.id} 
                                                                        className="p-2 border-r border-slate-100 text-center transition-colors cursor-pointer group/cell hover:bg-slate-50"
                                                                        onClick={() => setPaymentModal({ student, fee })}
                                                                    >
                                                                        <div className={`mx-auto rounded-xl px-2.5 py-2 border-2 text-xs font-bold ${statusColor} transition-all transform group-hover/cell:scale-[1.02] flex flex-col items-center justify-center min-h-[58px] shadow-sm`}>
                                                                            <div className="flex items-center gap-1.5">
                                                                                <span className={`w-2 h-2 rounded-full ${dotColor} animate-pulse shrink-0`}></span>
                                                                                <span className="tracking-wide">{p.status}</span>
                                                                            </div>
                                                                            <span className="text-[10px] opacity-90 mt-1 font-mono">
                                                                                {p.status === "部分繳納" ? `$${p.paidAmount}/$${p.customAmount}` : `$${p.customAmount}`}
                                                                            </span>
                                                                            {/* 已繳清狀態：在格子下方註記日期時間 */}
                                                                            {p.status === "已繳清" && p.paidAt && (
                                                                                <span className="text-[9px] font-medium text-emerald-900 mt-1 whitespace-nowrap bg-emerald-200/50 px-1 py-0.5 rounded border border-emerald-300">
                                                                                    {p.paidAt}
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    ))}

                                                    <tr className="bg-slate-50 font-bold border-t-2 border-slate-200">
                                                        <td colSpan="3" className="px-4 py-4 text-right sticky left-0 bg-slate-50 z-10 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] text-slate-700">
                                                            目前已收/應收 統計
                                                        </td>
                                                        {fees.map(f => {
                                                            const fStat = getFeeStats(f.id);
                                                            return (
                                                                <td key={f.id} className="p-4 text-center border-r border-slate-200">
                                                                    <p className="text-emerald-600 text-sm">${fStat.received.toLocaleString()}</p>
                                                                    <p className="text-slate-400 text-[10px] font-normal mt-0.5">應收: ${fStat.expected.toLocaleString()}</p>
                                                                    <div className="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                                                                        <div 
                                                                            className="bg-brand-500 h-full" 
                                                                            style={{ width: `${fStat.expected > 0 ? (fStat.received / fStat.expected) * 100 : 0}%` }}
                                                                        ></div>
                                                                    </div>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 5. Excel 備份與匯入 */}
                            {activeTab === 'backup' && (
                                <div className="space-y-6 max-w-2xl">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-emerald-50 p-2 text-emerald-600 rounded-lg">
                                                <SvgIcon name="file-spreadsheet" className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-lg text-slate-800">試算表備份中心</h3>
                                                <p className="text-xs text-slate-500">此功能可匯出或匯入整個系統的資料。包含班級、學生與所有繳費歷史紀錄。</p>
                                            </div>
                                        </div>

                                        <hr className="border-slate-100" />

                                        <div className="space-y-3">
                                            <h4 className="font-semibold text-slate-700">資料安全備份 (匯出 Excel)</h4>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                點選下方按鈕，系統會將名單大表包裝，產出含有多張工作表 (學生名冊、收費項目、繳費矩陣) 的 Excel 試算表，供您留底及離線編輯。
                                            </p>
                                            <button 
                                                type="button"
                                                onClick={exportToExcel}
                                                className="w-full md:w-auto px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center gap-2 shadow-md"
                                            >
                                                <SvgIcon name="download" />
                                                下載 Excel 備份大表 (.xlsx)
                                            </button>
                                        </div>

                                        <hr className="border-slate-100" />

                                        <div className="space-y-3">
                                            <h4 className="font-semibold text-slate-700">復原或讀取備份資料 (匯入 Excel)</h4>
                                            <p className="text-xs text-rose-500 leading-relaxed">
                                                ⚠️ 警告：匯入檔案將會完全覆蓋此瀏覽器當前儲存的學生、費用及所有繳費資料。請先下載備份以防萬一。
                                            </p>
                                            <div className="flex items-center justify-center w-full">
                                                <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-200 border-dashed rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100/50 transition-colors">
                                                    <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                                        <SvgIcon name="upload-cloud" className="w-8 h-8 text-slate-400 mb-2" />
                                                        <p className="mb-1 text-sm text-slate-500 font-semibold">點此處選擇並上傳備份 Excel 檔案</p>
                                                        <p className="text-xs text-slate-400">僅支援由本系統所匯出的 .xlsx 試算表格式</p>
                                                    </div>
                                                    <input 
                                                        type="file" 
                                                        accept=".xlsx" 
                                                        className="hidden" 
                                                        onChange={importFromExcel}
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* --- 全域互動彈出 Modal 區 --- */}

                    {/* Modal 1: 學生快速批量匯入面板 */}
                    {showImportModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-slate-800">快速批量匯入學生</h3>
                                    <button type="button" onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <SvgIcon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">匯入至特定班級</label>
                                    <select 
                                        value={importClass} 
                                        onChange={(e) => setImportClass(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                    >
                                        {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">請在下方貼上名冊文字</label>
                                    <textarea 
                                        rows="8" 
                                        placeholder={"請使用「座號+空白+姓名」格式，每行一位學生，例如：\n01 王小明\n02 陳大華\n03 林阿美"}
                                        value={importRawText}
                                        onChange={(e) => setImportRawText(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-brand-500 font-mono text-slate-700"
                                    ></textarea>
                                </div>

                                <div className="flex justify-end gap-2 mt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowImportModal(false)} 
                                        className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={handleBatchImport} 
                                        className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold"
                                    >
                                        確認解析並匯入
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 2: 學生大量批次編輯面板 */}
                    {showBatchEditModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-lg text-slate-800">批次修改「{batchClassFilter}」全班名單</h3>
                                    <button type="button" onClick={() => setShowBatchEditModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <SvgIcon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="bg-amber-50 text-amber-800 border border-amber-100 p-3 rounded-xl text-xs flex gap-2">
                                    <SvgIcon name="alert-triangle" className="w-4 h-4 shrink-0 mt-0.5" />
                                    <span>
                                        這將<b>完全覆蓋並取代</b>當前該班級的所有學生。您可以直接在下方框內編輯，修改座號或姓名，或將別處的清單貼上於此。
                                    </span>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">框內名單內容 (每行一位，格式：座號  姓名)</label>
                                    <textarea 
                                        rows="10" 
                                        value={batchStudentsText}
                                        onChange={(e) => setEditFeeAmount(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-brand-500 font-mono text-slate-700"
                                    ></textarea>
                                </div>

                                <div className="flex justify-end gap-2 mt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowBatchEditModal(false)} 
                                        className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold"
                                    >
                                        放棄變更
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={handleSaveBatchEdit} 
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold"
                                    >
                                        儲存並更新名冊
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 3: 修改繳費面板 */}
                    {paymentModal && (() => {
                        const { student, fee } = paymentModal;
                        const record = getStudentPayment(student.id, fee.id);
                        return (
                            <PaymentModal 
                                student={student}
                                fee={fee}
                                record={record}
                                onCancel={() => setPaymentModal(null)}
                                onSave={handleSavePaymentModal}
                                showToast={showToast}
                            />
                        );
                    })()}

                    {/* 安全自訂確認視窗 */}
                    <CustomConfirmModal 
                        isOpen={!!confirmModal}
                        title={confirmModal?.title || ""}
                        message={confirmModal?.message || ""}
                        onConfirm={confirmModal?.onConfirm || (() => {})}
                        onCancel={() => setConfirmModal(null)}
                    />

                    {/* Toast 訊息提醒 */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-2 bg-slate-900 text-white py-3 px-5 rounded-2xl shadow-2xl border border-slate-800 animate-slide-in">
                            <div className={`w-2 h-2 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'}`}></div>
                            <span className="text-sm font-semibold">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
