<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查理學生收費管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#bae2fd',
                            300: '#7cc8fc',
                            400: '#38abf8',
                            500: '#0e90e9',
                            600: '#0273ca',
                            700: '#035ca4',
                            800: '#074e87',
                            900: '#0c4270',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM (UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- PWA Manifest & Meta Tags -->

<body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <!-- Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'charlie-fee-v1';
                    const urlsToCache = [
                        './',
                        './index.html'
                    ];
                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
                        );
                    });
                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request).then(response => response || fetch(event.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('Service Worker 註冊成功'))
                    .catch(err => console.log('Service Worker 註冊失敗', err));
            });
        }
    </script>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 預設示範資料
        const DEFAULT_CLASSES = ["一年一班", "一年二班"];
        const DEFAULT_STUDENTS = [
            { id: "s1", class: "一年一班", seatNo: "01", name: "陳小明" },
            { id: "s2", class: "一年一班", seatNo: "02", name: "張小華" },
            { id: "s3", class: "一年一班", seatNo: "03", name: "李小美" },
            { id: "s4", class: "一年二班", seatNo: "01", name: "王大同" },
            { id: "s5", class: "一年二班", seatNo: "02", name: "劉芳芳" }
        ];
        const DEFAULT_FEES = [
            { id: "f1", name: "學期班費", amount: 500 },
            { id: "f2", name: "戶外教學費", amount: 1200 },
            { id: "f3", name: "英文講義費", amount: 250 }
        ];
        const DEFAULT_PAYMENTS = {
            // key 格式為: "studentId_feeId"
            "s1_f1": { status: "已繳清", customAmount: 500, paidAmount: 500 },
            "s1_f2": { status: "部分繳納", customAmount: 1200, paidAmount: 600 },
            "s1_f3": { status: "未繳", customAmount: 250, paidAmount: 0 },
            "s2_f1": { status: "已繳清", customAmount: 500, paidAmount: 500 },
            "s2_f2": { status: "已繳清", customAmount: 1000, paidAmount: 1000 }, // 自訂應繳
            "s3_f1": { status: "未繳", customAmount: 500, paidAmount: 0 }
        };

        // 將修改繳費面板抽離成獨立的 React 元件，避免在條件渲染區塊內呼叫 Hook 違反 React 的規定。
        function PaymentModal({ student, fee, record, onCancel, onSave, showToast }) {
            // 建立內部的暫存狀態
            const [status, setStatus] = useState(record.status);
            const [customAmount, setCustomAmount] = useState(record.customAmount);
            const [paidAmount, setPaidAmount] = useState(record.paidAmount);

            // 當外部 record 改變時重新同步內部狀態
            useEffect(() => {
                setStatus(record.status);
                setCustomAmount(record.customAmount);
                setPaidAmount(record.paidAmount);
            }, [record]);

            const handleStatusChange = (newStatus) => {
                setStatus(newStatus);
                if (newStatus === "已繳清") {
                    setPaidAmount(customAmount);
                } else if (newStatus === "未繳") {
                    setPaidAmount(0);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4">
                        <div className="flex justify-between items-center">
                            <div>
                                <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full font-medium text-slate-500">{student.class} No.{student.seatNo}</span>
                                <h3 className="font-bold text-lg text-slate-800 mt-1">{student.name} — {fee.name}</h3>
                            </div>
                            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <hr className="border-slate-100" />

                        {/* 第一部分：自訂此生應繳 */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <label className="block text-xs font-bold text-slate-600 mb-1">
                                此生專屬應繳金額
                            </label>
                            <p className="text-[10px] text-slate-400 mb-2">預設常規單價為 ${fee.amount}。可調整此學生此項特例應繳金額：</p>
                            <div className="flex gap-2">
                                <input 
                                    type="number" 
                                    value={customAmount}
                                    onChange={(e) => {
                                        const val = parseFloat(e.target.value) || 0;
                                        setCustomAmount(val);
                                        if (status === "已繳清") setPaidAmount(val);
                                    }}
                                    className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 font-semibold text-slate-800"
                                />
                                <button 
                                    onClick={() => {
                                        setCustomAmount(fee.amount);
                                        if (status === "已繳清") setPaidAmount(fee.amount);
                                        showToast("已重置為預設單價");
                                    }}
                                    className="px-3 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-xs font-semibold text-slate-700 transition-colors shrink-0"
                                >
                                    恢復預設單價
                                </button>
                            </div>
                        </div>

                        {/* 第二部分：繳費狀態 */}
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 mb-2">繳費狀態切換</label>
                            <div className="grid grid-cols-3 gap-2">
                                {["未繳", "部分繳納", "已繳清"].map(st => {
                                    let btnStyle = "border-slate-200 text-slate-600 hover:bg-slate-50";
                                    if (status === st) {
                                        if (st === "已繳清") btnStyle = "bg-emerald-600 border-emerald-600 text-white";
                                        if (st === "部分繳納") btnStyle = "bg-amber-500 border-amber-500 text-white";
                                        if (st === "未繳") btnStyle = "bg-rose-500 border-rose-500 text-white";
                                    }
                                    return (
                                        <button
                                            key={st}
                                            onClick={() => handleStatusChange(st)}
                                            className={`py-2 border rounded-xl text-xs font-bold transition-all ${btnStyle}`}
                                        >
                                            {st}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 第三部分：已繳金額 */}
                        {status === "部分繳納" && (
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 mb-1.5">已收金額 (部分繳納)</label>
                                <input 
                                    type="number" 
                                    value={paidAmount}
                                    max={customAmount}
                                    onChange={(e) => setPaidAmount(Math.min(parseFloat(e.target.value) || 0, customAmount))}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500 font-semibold text-emerald-600"
                                />
                                <p className="text-[10px] text-slate-400 mt-1">金額不得大於應繳上限 (${customAmount})</p>
                            </div>
                        )}

                        {/* 控制按鈕 */}
                        <div className="flex justify-end gap-2 mt-4">
                            <button 
                                onClick={onCancel} 
                                className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-semibold"
                            >
                                取消
                            </button>
                            <button 
                                onClick={() => onSave(student.id, fee.id, status, customAmount, paidAmount)} 
                                className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-md"
                            >
                                儲存更新
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // --- 狀態管理 ---
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, students, fees, matrix, backup
            const [classes, setClasses] = useState(() => {
                const saved = localStorage.getItem('charlie_classes');
                return saved ? JSON.parse(saved) : DEFAULT_CLASSES;
            });
            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('charlie_students');
                return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
            });
            const [fees, setFees] = useState(() => {
                const saved = localStorage.getItem('charlie_fees');
                return saved ? JSON.parse(saved) : DEFAULT_FEES;
            });
            const [payments, setPayments] = useState(() => {
                const saved = localStorage.getItem('charlie_payments');
                return saved ? JSON.parse(saved) : DEFAULT_PAYMENTS;
            });

            // 學生名單篩選與編輯相關狀態
            const [selectedClass, setSelectedClass] = useState(classes[0] || '');
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ class: '', seatNo: '', name: '' });
            
            // 批量匯入相關狀態
            const [importClass, setImportClass] = useState(classes[0] || '');
            const [importRawText, setImportRawText] = useState('');
            const [showImportModal, setShowImportModal] = useState(false);
            
            // 批量編輯學生狀態
            const [showBatchEditModal, setShowBatchEditModal] = useState(false);
            const [batchClassFilter, setBatchClassFilter] = useState(classes[0] || '');
            const [batchStudentsText, setBatchStudentsText] = useState('');

            // 費用名目相關狀態
            const [editingFee, setEditingFee] = useState(null);
            const [newFee, setNewFee] = useState({ name: '', amount: '' });

            // 收費登記矩陣相關狀態
            const [matrixClassFilter, setMatrixClassFilter] = useState('all');
            const [paymentModal, setPaymentModal] = useState(null); // { student, fee }

            // 通知提醒狀態
            const [toast, setToast] = useState(null);

            // 當 classes 改變時，更新相關的預設下拉選項
            useEffect(() => {
                if (classes.length > 0) {
                    if (!selectedClass) setSelectedClass(classes[0]);
                    if (!importClass) setImportClass(classes[0]);
                    if (!batchClassFilter) setBatchClassFilter(classes[0]);
                }
            }, [classes]);

            // 持久化儲存
            useEffect(() => {
                localStorage.setItem('charlie_classes', JSON.stringify(classes));
            }, [classes]);
            useEffect(() => {
                localStorage.setItem('charlie_students', JSON.stringify(students));
            }, [students]);
            useEffect(() => {
                localStorage.setItem('charlie_fees', JSON.stringify(fees));
            }, [fees]);
            useEffect(() => {
                localStorage.setItem('charlie_payments', JSON.stringify(payments));
            }, [payments]);

            // 顯示 Toast 訊息
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            // --- 班級管理邏輯 ---
            const handleAddClass = (className) => {
                const trimmed = className.trim();
                if (!trimmed) return;
                if (classes.includes(trimmed)) {
                    showToast('班級名稱已存在', 'error');
                    return;
                }
                setClasses([...classes, trimmed]);
                showToast(`已成功建立班級「${trimmed}」`);
            };

            const handleDeleteClass = (className) => {
                if (confirm(`確定要刪除「${className}」嗎？這將不會刪除該班的學生，但他們將失去班級關聯。`)) {
                    setClasses(classes.filter(c => c !== className));
                    showToast(`已刪除班級「${className}」`);
                }
            };

            // --- 學生管理邏輯 ---
            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.class || !newStudent.name || !newStudent.seatNo) {
                    showToast('請填寫完整學生資料', 'error');
                    return;
                }
                const id = 'student_' + Date.now();
                setStudents([...students, { ...newStudent, id }]);
                setNewStudent({ class: newStudent.class, seatNo: '', name: '' });
                showToast(`已新增學生「${newStudent.name}」`);
            };

            const handleUpdateStudent = (studentId, updatedFields) => {
                setStudents(students.map(s => s.id === studentId ? { ...s, ...updatedFields } : s));
                setEditingStudent(null);
                showToast('學生資料已更新');
            };

            const handleDeleteStudent = (studentId, studentName) => {
                if (confirm(`確定要刪除學生「${studentName}」嗎？相關繳費紀錄也將一併移除。`)) {
                    setStudents(students.filter(s => s.id !== studentId));
                    // 清理相關繳費紀錄
                    const newPayments = { ...payments };
                    Object.keys(newPayments).forEach(key => {
                        if (key.startsWith(`${studentId}_`)) {
                            delete newPayments[key];
                        }
                    });
                    setPayments(newPayments);
                    showToast(`已刪除學生「${studentName}」`);
                }
            };

            // 批量匯入邏輯 (格式：座號 姓名 或 座號,姓名 一行一個)
            const handleBatchImport = () => {
                if (!importClass) {
                    showToast('請先選擇班級', 'error');
                    return;
                }
                if (!importRawText.trim()) {
                    showToast('請輸入匯入內容', 'error');
                    return;
                }

                const lines = importRawText.split('\n');
                const addedStudents = [];
                let successCount = 0;

                lines.forEach(line => {
                    const cleanLine = line.trim();
                    if (!cleanLine) return;

                    // 支援空白、逗號、Tab 分割
                    const parts = cleanLine.split(/[\s,，\t]+/);
                    if (parts.length >= 2) {
                        const seatNo = parts[0].padStart(2, '0'); // 自動補零
                        const name = parts.slice(1).join(' '); // 姓名中若有空格則合併
                        addedStudents.push({
                            id: 'student_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(),
                            class: importClass,
                            seatNo,
                            name
                        });
                        successCount++;
                    }
                });

                if (successCount > 0) {
                    setStudents([...students, ...addedStudents]);
                    setImportRawText('');
                    setShowImportModal(false);
                    showToast(`成功匯入 ${successCount} 位學生至「${importClass}」`);
                } else {
                    showToast('未偵測到有效格式，請使用「座號 姓名」格式，例如：「01 張小明」', 'error');
                }
            };

            // 大量批次編輯學生邏輯 (載入該班現有學生，編輯後覆蓋)
            const handleOpenBatchEdit = () => {
                if (!batchClassFilter) {
                    showToast('請選擇要編輯的班級', 'error');
                    return;
                }
                const targetStudents = students
                    .filter(s => s.class === batchClassFilter)
                    .sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
                
                const text = targetStudents.map(s => `${s.seatNo}\t${s.name}`).join('\n');
                setBatchStudentsText(text);
                setShowBatchEditModal(true);
            };

            const handleSaveBatchEdit = () => {
                const lines = batchStudentsText.split('\n');
                const updatedStudentsForClass = [];
                let parsedCount = 0;

                lines.forEach(line => {
                    const cleanLine = line.trim();
                    if (!cleanLine) return;
                    const parts = cleanLine.split(/[\s,，\t]+/);
                    if (parts.length >= 2) {
                        const seatNo = parts[0].padStart(2, '0');
                        const name = parts.slice(1).join(' ');
                        updatedStudentsForClass.push({
                            id: 'student_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(),
                            class: batchClassFilter,
                            seatNo,
                            name
                        });
                        parsedCount++;
                    }
                });

                // 先移除該班舊有學生，再補入新的
                const otherClassStudents = students.filter(s => s.class !== batchClassFilter);
                setStudents([...otherClassStudents, ...updatedStudentsForClass]);
                setShowBatchEditModal(false);
                showToast(`已重置並更新「${batchClassFilter}」共 ${parsedCount} 位學生名單`);
            };


            // --- 費用名目邏輯 ---
            const handleAddFee = (e) => {
                e.preventDefault();
                if (!newFee.name || !newFee.amount) {
                    showToast('請填寫完整費用資料', 'error');
                    return;
                }
                const id = 'fee_' + Date.now();
                setFees([...fees, {
                    id,
                    name: newFee.name,
                    amount: parseFloat(newFee.amount)
                }]);
                setNewFee({ name: '', amount: '' });
                showToast(`已新增費用項目「${newFee.name}」`);
            };

            const handleUpdateFee = (feeId, updatedFields) => {
                const updatedAmount = parseFloat(updatedFields.amount);
                setFees(fees.map(f => f.id === feeId ? { ...f, name: updatedFields.name, amount: updatedAmount } : f));
                setEditingFee(null);
                showToast('費用項目已更新');
            };

            const handleDeleteFee = (feeId, feeName) => {
                if (confirm(`確定要刪除「${feeName}」嗎？所有學生的此項繳費登記都將被刪除。`)) {
                    setFees(fees.filter(f => f.id !== feeId));
                    // 清理相關繳費紀錄
                    const newPayments = { ...payments };
                    Object.keys(newPayments).forEach(key => {
                        if (key.endsWith(`_${feeId}`)) {
                            delete newPayments[key];
                        }
                    });
                    setPayments(newPayments);
                    showToast(`已刪除費用項目「${feeName}」`);
                }
            };


            // --- 收費登記矩陣邏輯 ---
            // 取得特定學生、特定費用的繳費狀態 (若無紀錄則回傳未繳及預設應繳金額)
            const getStudentPayment = (studentId, feeId) => {
                const record = payments[`${studentId}_${feeId}`];
                const feeItem = fees.find(f => f.id === feeId);
                const defaultAmount = feeItem ? feeItem.amount : 0;

                if (!record) {
                    return {
                        status: "未繳",
                        customAmount: defaultAmount,
                        paidAmount: 0
                    };
                }
                return {
                    status: record.status || "未繳",
                    customAmount: record.customAmount !== undefined ? record.customAmount : defaultAmount,
                    paidAmount: record.paidAmount || 0
                };
            };

            // 快速循環切換狀態
            const handleQuickTogglePayment = (studentId, feeId) => {
                const current = getStudentPayment(studentId, feeId);
                let nextStatus = "未繳";
                let nextPaid = 0;

                if (current.status === "未繳") {
                    nextStatus = "已繳清";
                    nextPaid = current.customAmount;
                } else if (current.status === "已繳清") {
                    nextStatus = "部分繳納";
                    nextPaid = Math.floor(current.customAmount / 2); // 預設半數
                } else {
                    nextStatus = "未繳";
                    nextPaid = 0;
                }

                setPayments(prev => ({
                    ...prev,
                    [`${studentId}_${feeId}`]: {
                        status: nextStatus,
                        customAmount: current.customAmount,
                        paidAmount: nextPaid
                    }
                }));
            };

            // 儲存修改繳費面板
            const handleSavePaymentModal = (studentId, feeId, status, customAmount, paidAmount) => {
                let actualPaid = paidAmount;
                if (status === "已繳清") actualPaid = customAmount;
                if (status === "未繳") actualPaid = 0;

                setPayments(prev => ({
                    ...prev,
                    [`${studentId}_${feeId}`]: {
                        status,
                        customAmount,
                        paidAmount: actualPaid
                    }
                }));
                setPaymentModal(null);
                showToast("繳費設定已更新");
            };


            // --- 數據統計分析 (儀表板) ---
            const stats = useMemo(() => {
                let totalExpected = 0;
                let totalReceived = 0;

                students.forEach(student => {
                    fees.forEach(fee => {
                        const pay = getStudentPayment(student.id, fee.id);
                        totalExpected += pay.customAmount;
                        totalReceived += pay.paidAmount;
                    });
                });

                const totalUnpaid = totalExpected - totalReceived;
                const progress = totalExpected > 0 ? Math.round((totalReceived / totalExpected) * 100) : 0;

                return {
                    totalExpected,
                    totalReceived,
                    totalUnpaid,
                    progress
                };
            }, [students, fees, payments]);

            // 計算各單項收費目的的統計
            const getFeeStats = (feeId) => {
                let expected = 0;
                let received = 0;
                let countPaid = 0;
                let countPartial = 0;
                let countUnpaid = 0;

                students.forEach(student => {
                    const pay = getStudentPayment(student.id, feeId);
                    expected += pay.customAmount;
                    received += pay.paidAmount;
                    if (pay.status === "已繳清") countPaid++;
                    else if (pay.status === "部分繳納") countPartial++;
                    else countUnpaid++;
                });

                return { expected, received, countPaid, countPartial, countUnpaid };
            };


            // --- Excel 匯入/匯出 (SheetJS) ---
            const exportToExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();

                    // 1. 學生名冊
                    const studentData = students.map(s => ({
                        "班級": s.class,
                        "座號": s.seatNo,
                        "姓名": s.name
                    }));
                    const wsStudents = XLSX.utils.json_to_sheet(studentData);
                    XLSX.utils.book_append_sheet(wb, wsStudents, "學生名冊");

                    // 2. 收費項目
                    const feeData = fees.map(f => ({
                        "費用名稱": f.name,
                        "預設金額": f.amount
                    }));
                    const wsFees = XLSX.utils.json_to_sheet(feeData);
                    XLSX.utils.book_append_sheet(wb, wsFees, "收費項目");

                    // 3. 繳費矩陣明細
                    const matrixData = students.map(s => {
                        const row = {
                            "班級": s.class,
                            "座號": s.seatNo,
                            "姓名": s.name
                        };
                        fees.forEach(f => {
                            const p = getStudentPayment(s.id, f.id);
                            row[`${f.name}_狀態`] = p.status;
                            row[`${f.name}_應繳金額`] = p.customAmount;
                            row[`${f.name}_已繳金額`] = p.paidAmount;
                        });
                        return row;
                    });
                    const wsMatrix = XLSX.utils.json_to_sheet(matrixData);
                    XLSX.utils.book_append_sheet(wb, wsMatrix, "收費進度大表");

                    XLSX.writeFile(wb, `查理學生收費管理系統_備份_${new Date().toISOString().slice(0,10)}.xlsx`);
                    showToast("Excel 備份下載成功！");
                } catch (error) {
                    console.error(error);
                    showToast("匯出 Excel 發生錯誤", "error");
                }
            };

            const importFromExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });

                        // 試圖讀取「學生名冊」分頁
                        const wsStudents = workbook.Sheets["學生名冊"];
                        let importedStudents = [];
                        let importedClasses = [...classes];
                        if (wsStudents) {
                            const rawJson = XLSX.utils.sheet_to_json(wsStudents);
                            importedStudents = rawJson.map((row, idx) => {
                                const cls = row["班級"] || "未分類";
                                if (!importedClasses.includes(cls)) {
                                    importedClasses.push(cls);
                                }
                                return {
                                    id: `student_ex_${idx}_${Date.now()}`,
                                    class: cls,
                                    seatNo: String(row["座號"] || "").padStart(2, '0'),
                                    name: row["姓名"] || "無名氏"
                                };
                            });
                        }

                        // 試圖讀取「收費項目」分頁
                        const wsFees = workbook.Sheets["收費項目"];
                        let importedFees = [];
                        if (wsFees) {
                            const rawJson = XLSX.utils.sheet_to_json(wsFees);
                            importedFees = rawJson.map((row, idx) => ({
                                id: `fee_ex_${idx}_${Date.now()}`,
                                name: row["費用名稱"] || "未知費用",
                                amount: parseFloat(row["預設金額"] || 0)
                            }));
                        }

                        // 試圖讀取並還原「收費進度大表」
                        const wsMatrix = workbook.Sheets["收費進度大表"];
                        let importedPayments = {};
                        if (wsMatrix && importedStudents.length > 0 && importedFees.length > 0) {
                            const rawMatrix = XLSX.utils.sheet_to_json(wsMatrix);
                            rawMatrix.forEach(row => {
                                // 比對姓名與班級找出對應的學生
                                const student = importedStudents.find(s => s.name === row["姓名"] && s.class === row["班級"]);
                                if (student) {
                                    importedFees.forEach(fee => {
                                        const statusKey = `${fee.name}_狀態`;
                                        const customKey = `${fee.name}_應繳金額`;
                                        const paidKey = `${fee.name}_已繳金額`;

                                        if (row[statusKey] !== undefined) {
                                            importedPayments[`${student.id}_${fee.id}`] = {
                                                status: row[statusKey] || "未繳",
                                                customAmount: parseFloat(row[customKey] !== undefined ? row[customKey] : fee.amount),
                                                paidAmount: parseFloat(row[paidKey] || 0)
                                            };
                                        }
                                    });
                                }
                            });
                        }

                        // 更新狀態
                        if (importedClasses.length > 0) setClasses(importedClasses);
                        if (importedStudents.length > 0) setStudents(importedStudents);
                        if (importedFees.length > 0) setFees(importedFees);
                        if (Object.keys(importedPayments).length > 0) setPayments(importedPayments);

                        showToast("Excel 資料匯入並還原成功！");
                        e.target.value = null; // 清空 input
                    } catch (error) {
                        console.error(error);
                        showToast("解析 Excel 檔案失敗，請確保格式正確", "error");
                    }
                };
                reader.readAsBinaryString(file);
            };


            // --- UI 渲染輔助 ---
            // 根據選定的班級過濾學生
            const filteredStudents = useMemo(() => {
                if (activeTab === 'students') {
                    return students.filter(s => s.class === selectedClass)
                        .sort((a, b) => parseInt(a.seatNo) - parseInt(b.seatNo));
                }
                if (activeTab === 'matrix') {
                    if (matrixClassFilter === 'all') return students;
                    return students.filter(s => s.class === matrixClassFilter)
                        .sort((a, b) => {
                            if (a.class !== b.class) return a.class.localeCompare(b.class);
                            return parseInt(a.seatNo) - parseInt(b.seatNo);
                        });
                }
                return students;
            }, [students, selectedClass, activeTab, matrixClassFilter]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* 左側手機/桌面共用 Sidebar */}
                    <aside className="w-full md:w-64 bg-slate-900 text-slate-100 flex flex-col shrink-0 shadow-lg border-r border-slate-800">
                        <div className="p-6 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-500 p-2 rounded-xl text-white shadow-md shadow-brand-500/20">
                                    <i data-lucide="wallet" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">查理收費</h1>
                                    <p className="text-xs text-slate-400">學生收費管理系統</p>
                                </div>
                            </div>
                            <span className="bg-emerald-500/10 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full font-medium border border-emerald-500/20">PWA Ready</span>
                        </div>

                        {/* 導覽選單 */}
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                    activeTab === 'dashboard' 
                                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/10' 
                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                }`}
                            >
                                <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                儀表板總覽
                            </button>
                            <button
                                onClick={() => { setActiveTab('students'); setSelectedClass(classes[0] || ''); }}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                    activeTab === 'students' 
                                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/10' 
                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                }`}
                            >
                                <i data-lucide="users" className="w-4 h-4"></i>
                                學生名單管理
                            </button>
                            <button
                                onClick={() => setActiveTab('fees')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                    activeTab === 'fees' 
                                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/10' 
                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                }`}
                            >
                                <i data-lucide="receipt" className="w-4 h-4"></i>
                                費用名目設定
                            </button>
                            <button
                                onClick={() => setActiveTab('matrix')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                    activeTab === 'matrix' 
                                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/10' 
                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                }`}
                            >
                                <i data-lucide="grid-3x3" className="w-4 h-4"></i>
                                收費登記矩陣
                            </button>
                            <button
                                onClick={() => setActiveTab('backup')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                                    activeTab === 'backup' 
                                        ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/10' 
                                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                                }`}
                            >
                                <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                                Excel 備份與匯入
                            </button>
                        </nav>

                        {/* 班級快速小面板 */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950/40">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-semibold uppercase text-slate-500 tracking-wider">班級清單</span>
                                <button 
                                    onClick={() => {
                                        const name = prompt('請輸入新班級名稱（例如：一年三班）：');
                                        if (name) handleAddClass(name);
                                    }}
                                    className="p-1 rounded bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700"
                                >
                                    <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <div className="space-y-1 max-h-24 overflow-y-auto no-scrollbar">
                                {classes.map(c => (
                                    <div key={c} className="flex items-center justify-between text-xs text-slate-300 py-1 px-2 rounded hover:bg-slate-800/30 group">
                                        <span>{c}</span>
                                        <button 
                                            onClick={() => handleDeleteClass(c)}
                                            className="opacity-0 group-hover:opacity-100 text-rose-500 hover:text-rose-400 transition-opacity"
                                        >
                                            <i data-lucide="trash-2" className="w-3 h-3"></i>
                                        </button>
                                    </div>
                                ))}
                                {classes.length === 0 && <p className="text-[11px] text-slate-500">暫無班級</p>}
                            </div>
                        </div>
                    </aside>

                    {/* 右側主內容區 */}
                    <main className="flex-1 flex flex-col overflow-hidden min-w-0">
                        {/* 頂部 Header */}
                        <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                            <div className="flex items-center gap-2">
                                <span className="text-slate-400 text-sm">系統位置</span>
                                <span className="text-slate-400">/</span>
                                <span className="text-slate-800 font-semibold">
                                    {activeTab === 'dashboard' && '儀表板總覽'}
                                    {activeTab === 'students' && '學生名單管理'}
                                    {activeTab === 'fees' && '費用名目設定'}
                                    {activeTab === 'matrix' && '收費登記矩陣'}
                                    {activeTab === 'backup' && 'Excel 備份與匯入'}
                                </span>
                            </div>
                            
                            {/* PWA 提示 */}
                            <div className="text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                                <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                線上離線皆能運作
                            </div>
                        </header>

                        {/* 主內容容器 */}
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50">
                            
                            {/* 1. 儀表板總覽 */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 max-w-5xl">
                                    {/* 歡迎橫幅 */}
                                    <div className="bg-gradient-to-r from-brand-600 to-brand-800 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                                        <div>
                                            <h2 className="text-2xl font-bold mb-1">查理，歡迎回來！</h2>
                                            <p className="text-brand-100 text-sm">此儀表板已為您彙整目前所有班級的繳費進度。</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setActiveTab('matrix')} className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2 border border-white/10">
                                                <i data-lucide="grid-3x3" className="w-4 h-4"></i> 前往登記矩陣
                                            </button>
                                        </div>
                                    </div>

                                    {/* 四格統計卡片 */}
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
                                            <div className="p-3 bg-brand-50 text-brand-600 rounded-xl">
                                                <i data-lucide="users" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-medium">學生總人數</p>
                                                <p className="text-2xl font-bold text-slate-800">{students.length} 人</p>
                                            </div>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
                                            <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                                                <i data-lucide="banknote" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-medium">總應收金額</p>
                                                <p className="text-2xl font-bold text-slate-800">${stats.totalExpected.toLocaleString()}</p>
                                            </div>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
                                            <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                                                <i data-lucide="check-circle" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-medium">已收總額</p>
                                                <p className="text-2xl font-bold text-emerald-600">${stats.totalReceived.toLocaleString()}</p>
                                            </div>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4">
                                            <div className="p-3 bg-rose-50 text-rose-600 rounded-xl">
                                                <i data-lucide="clock" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-medium">未收餘額</p>
                                                <p className="text-2xl font-bold text-rose-600">${stats.totalUnpaid.toLocaleString()}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 進度大圖表卡片 */}
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="font-bold text-lg text-slate-800">總體收費進度</h3>
                                            <span className="text-brand-600 font-bold text-lg">{stats.progress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden mb-6">
                                            <div 
                                                className="bg-brand-500 h-full rounded-full transition-all duration-1000 ease-out"
                                                style={{ width: `${stats.progress}%` }}
                                            ></div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-4 text-center">
                                            <div className="border-r border-slate-100">
                                                <p className="text-xs text-slate-400 mb-1">目標項目</p>
                                                <p className="text-lg font-semibold text-slate-700">{fees.length} 項收費</p>
                                            </div>
                                            <div className="border-r border-slate-100">
                                                <p className="text-xs text-slate-400 mb-1">已收取金額</p>
                                                <p className="text-lg font-semibold text-emerald-600">${stats.totalReceived.toLocaleString()}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-400 mb-1">待繳庫存</p>
                                                <p className="text-lg font-semibold text-rose-500">${stats.totalUnpaid.toLocaleString()}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 單項費用進度列表 */}
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <h3 className="font-bold text-lg text-slate-800 mb-4">各收費項目進度</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {fees.map(f => {
                                                const fStat = getFeeStats(f.id);
                                                const pct = fStat.expected > 0 ? Math.round((fStat.received / fStat.expected) * 100) : 0;
                                                return (
                                                    <div key={f.id} className="p-4 rounded-xl border border-slate-100 hover:border-brand-100 transition-colors bg-slate-50/50">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <span className="font-semibold text-slate-700">{f.name}</span>
                                                            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full">{pct}%</span>
                                                        </div>
                                                        <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-3">
                                                            <div className="bg-brand-500 h-full" style={{ width: `${pct}%` }}></div>
                                                        </div>
                                                        <div className="flex justify-between text-xs text-slate-500">
                                                            <span>已收: ${fStat.received.toLocaleString()}</span>
                                                            <span>應收: ${fStat.expected.toLocaleString()}</span>
                                                        </div>
                                                        <div className="mt-3 pt-2 border-t border-slate-100 flex gap-2 text-[11px] text-slate-400">
                                                            <span>已繳清: {fStat.countPaid}人</span>
                                                            <span>部分: {fStat.countPartial}人</span>
                                                            <span>未繳: {fStat.countUnpaid}人</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {fees.length === 0 && (
                                                <div className="col-span-full py-8 text-center text-slate-400">
                                                    請先至「費用名目設定」新增收費項目。
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 2. 學生名單管理 */}
                            {activeTab === 'students' && (
                                <div className="space-y-6 max-w-5xl">
                                    {/* 操作面板 */}
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                        {/* 班級篩選頁籤 */}
                                        <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                                            {classes.map(c => (
                                                <button
                                                    key={c}
                                                    onClick={() => setSelectedClass(c)}
                                                    className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap ${
                                                        selectedClass === c 
                                                            ? 'bg-brand-600 text-white shadow-md' 
                                                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                            {classes.length === 0 && (
                                                <span className="text-sm text-slate-400">請先在左下角建立班級</span>
                                            )}
                                        </div>

                                        <div className="flex items-center gap-2 self-end md:self-auto">
                                            <button 
                                                onClick={() => { setImportClass(selectedClass); setShowImportModal(true); }}
                                                className="px-4 py-2 bg-brand-50 hover:bg-brand-100 text-brand-600 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1.5"
                                            >
                                                <i data-lucide="file-input" className="w-4 h-4"></i>
                                                快速批量匯入
                                            </button>
                                            <button 
                                                onClick={() => { setBatchClassFilter(selectedClass); handleOpenBatchEdit(); }}
                                                className="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-sm font-semibold transition-colors flex items-center gap-1.5"
                                            >
                                                <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                大量批次編輯
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        {/* 手動新增學生表單 */}
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm h-fit">
                                            <h3 className="font-bold text-lg text-slate-800 mb-4">手動新增學生</h3>
                                            <form onSubmit={handleAddStudent} className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">班級</label>
                                                    <select 
                                                        value={newStudent.class} 
                                                        onChange={(e) => setNewStudent({...newStudent, class: e.target.value})}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                    >
                                                        <option value="">選擇班級...</option>
                                                        {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                </div>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5">座號</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="01" 
                                                            value={newStudent.seatNo} 
                                                            onChange={(e) => setNewStudent({...newStudent, seatNo: e.target.value})}
                                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-500 mb-1.5">姓名</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="陳小明" 
                                                            value={newStudent.name} 
                                                            onChange={(e) => setNewStudent({...newStudent, name: e.target.value})}
                                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                        />
                                                    </div>
                                                </div>
                                                <button type="submit" className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-md transition-colors">
                                                    加入班級名單
                                                </button>
                                            </form>
                                        </div>

                                        {/* 學生名單列表 */}
                                        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                                <span className="font-bold text-slate-800">
                                                    {selectedClass ? `「${selectedClass}」學生名冊` : '請先選定班級'}
                                                </span>
                                                <span className="text-xs text-slate-500">共 {filteredStudents.length} 位學生</span>
                                            </div>
                                            
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-slate-100 text-slate-400 text-xs font-semibold uppercase bg-slate-50/30">
                                                            <th className="px-6 py-3.5 w-24">座號</th>
                                                            <th className="px-6 py-3.5">姓名</th>
                                                            <th className="px-6 py-3.5 text-right w-28">操作</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 text-sm">
                                                        {filteredStudents.map(student => (
                                                            <tr key={student.id} className="hover:bg-slate-50/50 group">
                                                                <td className="px-6 py-3.5 font-mono text-slate-600">
                                                                    {editingStudent === student.id ? (
                                                                        <input 
                                                                            type="text" 
                                                                            defaultValue={student.seatNo}
                                                                            onBlur={(e) => handleUpdateStudent(student.id, { seatNo: e.target.value })}
                                                                            className="w-12 bg-slate-50 border border-slate-200 rounded-md px-1 py-0.5"
                                                                            autoFocus
                                                                        />
                                                                    ) : student.seatNo}
                                                                </td>
                                                                <td className="px-6 py-3.5 font-medium text-slate-800">
                                                                    {editingStudent === student.id ? (
                                                                        <input 
                                                                            type="text" 
                                                                            defaultValue={student.name}
                                                                            onBlur={(e) => handleUpdateStudent(student.id, { name: e.target.value })}
                                                                            className="w-32 bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5"
                                                                            autoFocus
                                                                        />
                                                                    ) : student.name}
                                                                </td>
                                                                <td className="px-6 py-3.5 text-right">
                                                                    <div className="flex items-center justify-end gap-1.5">
                                                                        <button 
                                                                            onClick={() => setEditingStudent(editingStudent === student.id ? null : student.id)}
                                                                            className="p-1 rounded text-slate-400 hover:text-brand-600 hover:bg-brand-50"
                                                                        >
                                                                            <i data-lucide="edit" className="w-4 h-4"></i>
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleDeleteStudent(student.id, student.name)}
                                                                            className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50"
                                                                        >
                                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {filteredStudents.length === 0 && (
                                                            <tr>
                                                                <td colSpan="3" className="px-6 py-12 text-center text-slate-400">
                                                                    此班級目前沒有任何學生，可點選上方「快速批量匯入」快速貼上名單。
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 3. 費用名目設定 */}
                            {activeTab === 'fees' && (
                                <div className="space-y-6 max-w-5xl">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        {/* 新增費用項目 */}
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm h-fit">
                                            <h3 className="font-bold text-lg text-slate-800 mb-4">新增收費名目</h3>
                                            <form onSubmit={handleAddFee} className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">收費項目名稱</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="例：班費、講義費" 
                                                        value={newFee.name} 
                                                        onChange={(e) => setNewFee({...newFee, name: e.target.value})}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-500 mb-1.5">預設應繳金額</label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="500" 
                                                        value={newFee.amount} 
                                                        onChange={(e) => setNewFee({...newFee, amount: e.target.value})}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500"
                                                    />
                                                </div>
                                                <button type="submit" className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-md transition-colors">
                                                    建立費用項目
                                                </button>
                                            </form>
                                        </div>

                                        {/* 費用項目清單 */}
                                        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                                <span className="font-bold text-slate-800">所有費用名目</span>
                                                <span className="text-xs text-slate-500">共 {fees.length} 個名目</span>
                                            </div>
                                            
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-slate-100 text-slate-400 text-xs font-semibold uppercase bg-slate-50/30">
                                                            <th className="px-6 py-3.5">費用名稱</th>
                                                            <th className="px-6 py-3.5 w-40">預設單價</th>
                                                            <th className="px-6 py-3.5 text-right w-28">操作</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 text-sm">
                                                        {fees.map(fee => (
                                                            <tr key={fee.id} className="hover:bg-slate-50/50 group">
                                                                <td className="px-6 py-3.5 font-medium text-slate-800">
                                                                    {editingFee === fee.id ? (
                                                                        <input 
                                                                            type="text" 
                                                                            defaultValue={fee.name}
                                                                            onBlur={(e) => handleUpdateFee(fee.id, { ...fee, name: e.target.value })}
                                                                            className="w-full bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5"
                                                                            autoFocus
                                                                        />
                                                                    ) : fee.name}
                                                                </td>
                                                                <td className="px-6 py-3.5 font-semibold text-slate-700">
                                                                    {editingFee === fee.id ? (
                                                                        <input 
                                                                            type="number" 
                                                                            defaultValue={fee.amount}
                                                                            onBlur={(e) => handleUpdateFee(fee.id, { ...fee, amount: e.target.value })}
                                                                            className="w-24 bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5"
                                                                            autoFocus
                                                                        />
                                                                    ) : `$${fee.amount.toLocaleString()}`}
                                                                </td>
                                                                <td className="px-6 py-3.5 text-right">
                                                                    <div className="flex items-center justify-end gap-1.5">
                                                                        <button 
                                                                            onClick={() => setEditingFee(editingFee === fee.id ? null : fee.id)}
                                                                            className="p-1 rounded text-slate-400 hover:text-brand-600 hover:bg-brand-50"
                                                                        >
                                                                            <i data-lucide="edit" className="w-4 h-4"></i>
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleDeleteFee(fee.id, fee.name)}
                                                                            className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50"
                                                                        >
                                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {fees.length === 0 && (
                                                            <tr>
                                                                <td colSpan="3" className="px-6 py-12 text-center text-slate-400">
                                                                    目前沒有任何費用名目，請使用左側表單新增。
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 4. 收費登記矩陣 */}
                            {activeTab === 'matrix' && (
                                <div className="space-y-6">
                                    {/* 篩選工具列 */}
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                        <div className="flex items-center gap-3">
                                            <span className="text-sm font-semibold text-slate-500">篩選班級：</span>
                                            <select 
                                                value={matrixClassFilter} 
                                                onChange={(e) => setMatrixClassFilter(e.target.value)}
                                                className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 font-medium"
                                            >
                                                <option value="all">全部班級</option>
                                                {classes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="text-xs text-slate-400">
                                            💡 提示：點擊任何繳費格子，可手動修改此生個別應繳、已繳金額，或快速切換狀態。
                                        </div>
                                    </div>

                                    {/* 大矩陣主表格 */}
                                    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse table-fixed">
                                                <thead>
                                                    <tr className="border-b border-slate-200 bg-slate-50/50 text-slate-500 text-xs font-bold uppercase">
                                                        <th className="px-4 py-4 w-28 sticky left-0 bg-slate-50 z-10 border-r border-slate-100">班級</th>
